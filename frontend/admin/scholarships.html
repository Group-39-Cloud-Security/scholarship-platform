<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' http://*.execute-api.localhost.floci.io:4566 http://*.execute-api.localhost:4566; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Scholarships | Admin | Scholarship Platform</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar">
    <strong>Scholarship Platform</strong>
    <nav id="nav" aria-label="Main"></nav>
  </header>
  <main>
    <h1>Scholarships</h1>
    <nav id="admin-nav" class="admin-nav" aria-label="Admin pages"></nav>
    <p><a href="scholarship-edit.html">Create a new scholarship</a></p>
    <form id="filters" class="inline" novalidate>
      <label>Status
        <select id="status"><option value="">Any</option><option value="draft">Draft</option><option value="published">Published</option><option value="closed">Closed</option></select>
      </label>
      <button type="submit">Show</button>
    </form>
    <p class="hint">Drafts can be edited and published; published ones can be closed. Rubric, eligibility and deadline are locked after publishing.</p>
    <p id="message" class="message" role="alert" hidden></p>
    <p id="empty" hidden>No scholarships match.</p>
    <table id="list" hidden>
      <thead><tr><th>Scholarship</th><th>Deadline</th><th>Awards used</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script src="admin-common.js"></script>
  <script src="scholarships.js"></script>
</body>
</html>
