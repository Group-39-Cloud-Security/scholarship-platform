<!-- change-password.html — Owner: Mohamed Khalil (shared shell). Set a new password (required after a temporary one). Rules: CLAUDE.md §6, §10 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' http://*.execute-api.localhost.floci.io:4566 http://*.execute-api.localhost:4566; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Change password | Scholarship Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <strong>Scholarship Platform</strong>
    <nav id="nav" aria-label="Main"></nav>
  </header>
  <main class="narrow">
    <h1>Change password</h1>
    <p id="required" class="message info" hidden>Your account has a temporary password. Choose your own before you continue.</p>
    <p id="message" class="message" role="alert" hidden></p>

    <form id="password-form" class="form" novalidate>
      <label for="current">Current password</label>
      <input id="current" type="password" autocomplete="current-password" maxlength="200" required>
      <label for="new">New password (at least 10 characters)</label>
      <input id="new" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <label for="repeat">Repeat the new password</label>
      <input id="repeat" type="password" autocomplete="new-password" minlength="10" maxlength="72" required>
      <p><button type="submit">Change password</button></p>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/change-password.js"></script>
</body>
</html>
